<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>ROAD BOOK · GTA VI</title>
<style>
:root{color-scheme:dark;--bg:#0d141b;--panel:#17232d;--panel2:#1d2d38;--line:#30434f;--muted:#9fb0ba;--text:#f1f5f6;--gold:#d5ad62;--green:#7bc69a;--danger:#e39a8b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 80% -10%,#263946 0,transparent 45%),var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input{font:inherit}
header{padding:calc(17px + env(safe-area-inset-top)) 17px 15px;border-bottom:1px solid var(--line);background:#101a22ed;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}
.brand{font-size:10px;letter-spacing:.2em;color:var(--gold);font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
.top h1{font-size:23px;margin:0;letter-spacing:.04em}
.sub{color:var(--muted);font-size:11px;margin-top:4px}
.wrap{max-width:760px;margin:auto;padding:16px 14px 42px}
.crumb{font-size:11px;color:var(--muted);margin:0 0 14px;line-height:1.7;overflow-wrap:anywhere}
.crumb span{color:var(--gold)}
.hero{padding:17px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(135deg,#20313b,#15212a);margin-bottom:15px}
.eyebrow{font-size:9px;letter-spacing:.18em;color:var(--gold);font-weight:800}
.hero h2{font-size:23px;margin:7px 0 5px}
.hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.tile{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel2),var(--panel));border-radius:14px;padding:14px;text-align:left;color:var(--text);min-height:91px;display:flex;flex-direction:column;justify-content:space-between;gap:11px;cursor:pointer;touch-action:manipulation}
.tile:active{transform:scale(.985);border-color:var(--gold)}
.tile .name{font-weight:750;font-size:14px;overflow-wrap:anywhere}
.tile .meta{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:5px}
.arrow{color:var(--gold);white-space:nowrap}
.back,.tools button{border:1px solid var(--line);background:#182630;color:var(--text);border-radius:11px;padding:11px 13px;font-size:12px;font-weight:650;touch-action:manipulation}
.back{margin-bottom:13px}
.progress{margin:14px 0 0}
.progresslabel{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:7px;gap:10px}
.progresslabel b{color:var(--text);font-variant-numeric:tabular-nums}
.progressline{height:7px;border-radius:20px;background:#344650;overflow:hidden}
.progressline i{display:block;height:100%;background:var(--green);border-radius:20px;transition:width .15s}
.list{display:flex;flex-direction:column;gap:7px}
.item{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:0}
.item input{width:22px;height:22px;accent-color:#75c393;flex:none}
.item .txt{min-width:0;flex:1}
.item .title{font-size:13px;font-weight:650;overflow-wrap:anywhere}
.item .note{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4;overflow-wrap:anywhere}
.pill{font-size:9px;color:var(--gold);border:1px solid #66563a;border-radius:20px;padding:4px 6px;white-space:nowrap}
.search{width:100%;border:1px solid var(--line);background:#14212a;color:var(--text);padding:12px;border-radius:11px;margin:0 0 11px;font-size:14px}
.tools{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tools button{color:var(--muted);flex:1}
.tools button:active,.back:active{border-color:var(--gold)}
.empty{color:var(--muted);font-size:12px;padding:16px;border:1px dashed var(--line);border-radius:12px;line-height:1.5}
.statrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;gap:12px}
.statrow b{color:var(--gold);text-align:right}
.notice{font-size:11px;line-height:1.5;color:var(--muted);padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin:12px 0;background:#14212a}
.notice strong{color:var(--green)}
.notice.warn strong{color:var(--gold)}
.foot{margin-top:23px;color:#82939d;font-size:10px;line-height:1.5;text-align:center}
.fileinput{display:none}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.wrap{padding-top:22px}}
@media(max-width:360px){.pill{display:none}.hero h2{font-size:21px}}
</style>
</head>

mplacement restant — à compléter à ta prochaine découverte.", "Repère": "☐"}, {"Case": "CA-11", "Modèle": "À découvrir", "État": "À découvrir", "Note": "Emplacement restant — à compléter à ta prochaine découverte.", "Repère": "☐"}, {"Case": "CA-12", "Modèle": "À découvrir", "État": "À découvrir", "Note": "Emplacement restant — à compléter à ta prochaine découverte.", "Repère": "☐"}, {"Case": "CA-13", "Modèle": "À découvrir", "État": "À découvrir", "Note": "Emplacement restant — à compléter à ta prochaine découverte.", "Repère": "☐"}, {"Case": "CA-14", "Modèle": "À découvrir", "État": "À découvrir", "Note": "Emplacement restant — à compléter à ta prochaine découverte.", "Repère": "☐"}]}, "counts": {"Coupés": "3/18", "Muscle Cars": "2/26", "Tout-terrain": "1/8", "Sportives": "2/13", "Berlines": "5/29", "Pick-ups": "7/17", "Supersportives": "1/9", "SUV": "4/23", "Camionnettes": "1/14"}};
const app=document.getElementById('app');
let path=[];
const icons={'Statistiques':'◷','Véhicules':'🚘','Armes':'⚒','Animaux':'♧','Équipement':'◇','Collections':'▣','Activités':'◉','Contacts':'♙','Gangs':'◆','Braquages':'▤','Défis':'✦','Histoire':'▤','Voitures':'🚗','Cycles':'🏍','Véhicules nautiques':'⚓','Appareils aériens':'✈','Véhicules de service':'🚐','Véhicules remarquables':'★','Coupés':'🚘','Muscle Cars':'🏁','Tout-terrain':'🚙','Sportives':'🏎','Berlines':'🚗','Pick-ups':'🛻','Supersportives':'🏎','SUV':'🚙','Camionnettes':'🚐'};
const storageKey='rb6:checks';
let storageAvailable=true;
function saved(){try{return JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){storageAvailable=false;return {}}}
function persist(data){try{localStorage.setItem(storageKey,JSON.stringify(data));storageAvailable=true;return true}catch(e){storageAvailable=false;return false}}
function setCheck(id,value){const data=saved();data[id]=value;return persist(data)}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalize(node){return typeof node==='string'?{name:node,sheet:node}:node}
function isDefaultChecked(row){return /Découvert|Confirmé selon relevé|Terminé/i.test(Object.values(row).join(' '))}
function rowName(row){const values=Object.values(row);return row['Modèle']||row['Nom']||row['Équipement']||row['Espèce / élément']||row['Activité']||row['Défi']||row['Collection / élément']||row['Statistique']||row['Indicateur']||values[1]||values[0]||'Élément'}
function rowNote(row){return row['Note']||row['Information enregistrée']||row['État']||row['Statut']||row['Progression']||''}
function listCount(sheet){const rows=DB.sheets[sheet]||[];if(!rows.length)return 'Aucune entrée';const data=saved();const done=rows.filter((r,i)=>data[sheet+'|'+i]??isDefaultChecked(r)).length;return done+'/'+rows.length+' validés'}
function crumb(){const names=['ROAD BOOK',...path.map(x=>x.name)];return '<div class="crumb">'+names.map((n,i)=>i===names.length-1?'<span>'+esc(n)+'</span>':esc(n)).join('　›　')+'</div>'}
function tile(node,meta='Ouvrir'){return `<button class="tile" type="button" data-open="${esc(node.name)}"><div class="name">${icons[node.name]||'▣'}　${esc(node.name)}</div><div class="meta"><span>${esc(meta)}</span><span class="arrow">OUVRIR　›</span></div></button>`}
function storageNotice(){return storageAvailable?'':'<div class="notice warn"><strong>Sauvegarde locale indisponible.</strong> Ce navigateur bloque le stockage. Utilise les boutons de sauvegarde pour exporter tes coches.</div>'}
function render(){
 let node=path[path.length-1],out=crumb();
 if(path.length)out+='<button class="back" id="back" type="button">← Retour</button>';
 if(!node){
  out+=`<section class="hero"><div class="eyebrow">DOSSIERS DE PROGRESSION</div><h2>ROAD BOOK</h2><p>Ouvre une rubrique, puis ses sous-dossiers. Tes 12 rubriques sont conservées ; aucun onglet Accueil séparé.</p></section><div class="grid">`+DB.main.map(n=>tile(n,n.children?n.children.length+' sous-dossiers':(DB.sheets[n.sheet]||[]).length+' entrées')).join('')+'</div>';
 }else if(node.children){
  out+=`<section class="hero"><div class="eyebrow">DOSSIER</div><h2>${icons[node.name]||'▣'} ${esc(node.name)}</h2><p>Choisis un sous-dossier pour afficher son contenu.</p></section><div class="grid">`+node.children.map(raw=>{const child=normalize(raw);return tile(child,child.children?child.children.length+' catégories':(DB.counts[child.name]||listCount(child.sheet||child.name))) }).join('')+'</div>';
 }else{
  const sheet=node.sheet||node.name,rows=DB.sheets[sheet]||[];
  if(node.name==='Statistiques'){
   out+=`<section class="hero"><div class="eyebrow">RELEVÉ ENREGISTRÉ</div><h2>Statistiques</h2><p>Valeurs reprises telles quelles du fichier d'origine. Elles ne sont pas modifiées par les cases à cocher.</p></section>`;
   if(rows.length)rows.forEach(r=>{const v=Object.values(r);out+=`<div class="statrow"><span>${esc(v[1]||v[0]||'')}</span><b>${esc(v[2]||'—')}</b></div>`});
   else out+='<div class="empty">Aucune statistique enregistrée dans cette rubrique.</div>';
  }else{
   const checks=saved(),done=rows.filter((r,i)=>checks[sheet+'|'+i]??isDefaultChecked(r)).length;
   out+=`<section class="hero"><div class="eyebrow">LISTE DÉTAILLÉE</div><h2>${icons[node.name]||'▣'} ${esc(node.name)}</h2><p>Coche ou décoche les éléments au fil de ta partie. Les coches sont enregistrées automatiquement dans ce navigateur.</p><div class="progress"><div class="progresslabel"><span>Progression de cette liste</span><b id="progress-count">${done} / ${rows.length}</b></div><div class="progressline"><i id="progress-bar" style="width:${rows.length?done/rows.length*100:0}%"></i></div></div></section>`;
   if(rows.length){
    out+='<input class="search" id="filter" type="search" placeholder="Rechercher dans cette liste…" autocomplete="off"><div class="list" id="items">';
    rows.forEach((r,i)=>{const name=rowName(r),note=rowNote(r),id=sheet+'|'+i,checked=checks[id]??isDefaultChecked(r);out+=`<label class="item" data-search="${esc((name+' '+note).toLowerCase())}"><input type="checkbox" data-id="${esc(id)}" ${checked?'checked':''}><div class="txt"><div class="title">${esc(name)}</div><div class="note">${esc(note)}</div></div><span class="pill">${checked?'VALIDÉ':'À SUIVRE'}</span></label>`});
    out+='</div>';
   }else out+='<div class="empty">Aucune liste détaillée n’est encore enregistrée dans cette rubrique. Aucune donnée n’a été ajoutée automatiquement.</div>';
  }
 }
 out+=storageNotice();
 out+=`<div class="tools"><button type="button" id="export">↓ Sauvegarder mes coches</button><button type="button" id="import">↑ Restaurer une sauvegarde</button><input class="fileinput" id="backup-file" type="file" accept="application/json,.json"></div><div class="foot">Sauvegarde automatique dans le stockage du navigateur, sur cet appareil.<br>Conseil : exporte régulièrement une copie JSON pour éviter toute perte.</div>`;
 app.innerHTML=out;
 document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{const current=path[path.length-1],list=current?.children||DB.main,found=list.map(normalize).find(x=>x.name===b.dataset.open);if(found){path.push(found);render()}}));
 document.getElementById('back')?.addEventListener('click',()=>{path.pop();render()});
 document.querySelectorAll('input[data-id]').forEach(el=>el.addEventListener('change',()=>{setCheck(el.dataset.id,el.checked);const row=el.closest('.item');row.querySelector('.pill').textContent=el.checked?'VALIDÉ':'À SUIVRE';const all=[...document.querySelectorAll('input[data-id]')],d=all.filter(x=>x.checked).length;const count=document.getElementById('progress-count');if(count)count.textContent=d+' / '+all.length;const bar=document.getElementById('progress-bar');if(bar)bar.style.width=(all.length?d/all.length*100:0)+'%';}));
 document.getElementById('filter')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.item').forEach(el=>el.style.display=el.dataset.search.includes(q)?'flex':'none')});
 document.getElementById('export')?.addEventListener('click',exportBackup);
 document.getElementById('import')?.addEventListener('click',()=>document.getElementById('backup-file')?.click());
 document.getElementById('backup-file')?.addEventListener('change',importBackup);
}
function exportBackup(){
 const payload={app:'ROAD BOOK GTA VI',format:1,exportedAt:new Date().toISOString(),checks:saved()};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='road-book-gta-vi-sauvegarde.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function importBackup(event){
 const file=event.target.files?.[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||data.app!=='ROAD BOOK GTA VI'||!data.checks||typeof data.checks!=='object'||Array.isArray(data.checks))throw new Error('Format invalide');const current=saved();let added=0;for(const [k,v] of Object.entries(data.checks)){if(typeof v==='boolean'&&!Object.prototype.hasOwnProperty.call(current,k)){current[k]=v;added++}}persist(current);alert('Sauvegarde lue. '+added+' coche(s) ajoutée(s). Les valeurs déjà présentes sur cet appareil ont été conservées.');render()}catch(e){alert('Fichier de sauvegarde non reconnu. Aucune donnée n’a été modifiée.')}};
 reader.readAsText(file);event.target.value='';
}
render();
</script>
